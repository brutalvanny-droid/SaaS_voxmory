<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
  </defs>
  <!-- Background with full coverage (no corner radius, as required for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)" />
  
  <!-- Stylized musical note combined with heart and sound wave, slightly scaled down for safe zone coverage (minimum 10% padding) -->
  <g transform="translate(106, 106) scale(0.9) translate(15, 15)">
    <!-- Golden Wave lines at background -->
    <path d="M 50,150 Q 100,120 150,150 T 250,150" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.3" />
    <path d="M 30,170 Q 100,130 170,170 T 270,170" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.2" />
    
    <!-- Heart combined with double eighth note -->
    <!-- Heart shape background glow -->
    <path d="M150,90 C150,90 220,20 220,70 C220,120 150,190 150,190 C150,190 80,120 80,70 C80,20 150,90 150,90 Z" fill="url(#gold)" opacity="0.15" filter="blur(8px)" />
    
    <!-- Main G-Clef / Note body path in luxury gold -->
    <path d="M110,250 C110,210 140,190 170,190 C200,190 220,210 220,240 C220,280 160,300 120,310 C90,290 80,250 80,220 C80,140 180,100 220,60" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Heart stroke -->
    <path d="M150,105 C150,105 210,45 210,90 C210,135 150,200 150,200 C150,200 90,135 90,90 C90,45 150,105 150,105 Z" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Solid Note Heads -->
    <circle cx="110" cy="245" r="24" fill="url(#gold)" />
    <circle cx="210" cy="90" r="16" fill="url(#gold)" />
    
    <!-- Little poetic sparkles (stars) around -->
    <path d="M 60,60 L 65,75 L 80,80 L 65,85 L 60,100 L 55,85 L 40,80 L 55,75 Z" fill="url(#gold)" />
    <path d="M 240,220 L 243,228 L 251,230 L 243,232 L 240,240 L 237,232 L 229,230 L 237,228 Z" fill="url(#gold)" transform="scale(0.7) translate(80, 40)" />
  </g>
</svg>
