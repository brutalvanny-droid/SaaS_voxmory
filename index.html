<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <!-- ============================================================
         SEO PRINCIPAL
         ============================================================ -->
    <title>VOXMORY | Chansons Personnalisées Poétiques & Rumba sur-mesure</title>
    <meta name="description" content="VOXMORY transforme vos plus belles histoires d'amour, de mariage, d'anniversaire ou d'hommage en chansons professionnelles personnalisées. Commandez votre Rumba ou Afrobeat unique." />
    <meta name="keywords" content="voxmory, chanson personnalisee, rumba congolaise, cadeau mariage, cadeau anniversaire, chanson sur mesure, kinshasa, afrique" />
    <meta name="author" content="VOXMORY" />
    <meta name="robots" content="index, follow" />

    <!-- Adresse canonique : évite le contenu dupliqué entre les variantes d'URL -->
    <link rel="canonical" href="https://saa-s-voxmory.vercel.app/" />

    <!-- ============================================================
         FAVICONS
         Sans eux, l'onglet du navigateur affiche une icône grise
         anonyme. Le format .ico couvre les navigateurs anciens, les
         PNG les tailles modernes, et apple-touch-icon l'ajout à
         l'écran d'accueil d'un iPhone.
         ============================================================ -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#A3FF12" />
    <meta name="theme-color" content="#07080A" />

    <!-- ============================================================
         OPEN GRAPH (Facebook, WhatsApp, LinkedIn)
         Sans og:image, un lien partagé s'affiche sans aucune vignette.
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saa-s-voxmory.vercel.app/" />
    <meta property="og:title" content="VOXMORY | Chansons Personnalisées Poétiques & Rumba sur-mesure" />
    <meta property="og:description" content="Offrez le plus mémorable des cadeaux. Nous transformons vos histoires de vie en véritables chefs-d'œuvre musicaux (Rumba, Afrobeat)." />
    <meta property="og:site_name" content="VOXMORY" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://saa-s-voxmory.vercel.app/og-image.jpg" />

    <!-- ============================================================
         VIDÉO D'ACCUEIL
         Déclarer la vidéo permet à Google de l'afficher dans les
         résultats. Le navigateur, lui, choisit le format qu'il sait
         lire : WebM en priorité (plus léger), MP4 en repli.
         ============================================================ -->
    <meta property="og:video" content="https://saa-s-voxmory.vercel.app/images/hero.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1280" />
    <meta property="og:video:height" content="720" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VOXMORY — Votre histoire, votre chanson" />

    <!-- ============================================================
         TWITTER / X
         ============================================================ -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://saa-s-voxmory.vercel.app/" />
    <meta property="twitter:title" content="VOXMORY | Chansons Personnalisées Poétiques" />
    <meta property="twitter:description" content="Offrez une chanson personnalisée unique créée par les meilleurs compositeurs." />
    <meta property="twitter:image" content="https://saa-s-voxmory.vercel.app/og-image.jpg" />
    <meta property="twitter:image:alt" content="VOXMORY — Votre histoire, votre chanson" />

    <!-- ============================================================
         DONNÉES STRUCTURÉES (JSON-LD)
         Permettent à Google d'afficher le nom, le prix et les avis
         directement dans les résultats de recherche.
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoObject",
        "name": "VOXMORY — Votre histoire, votre chanson",
        "description": "Plongée dans le studio VOXMORY, où vos histoires de vie deviennent des chansons personnalisées enregillées par des musiciens professionnels.",
        "thumbnailUrl": ["https://saa-s-voxmory.vercel.app/images/hero-poster.jpg"],
        "uploadDate": "2026-10-21",
        "contentUrl": "https://saa-s-voxmory.vercel.app/images/hero.mp4",
        "embedUrl": "https://saa-s-voxmory.vercel.app/",
        "duration": "PT12S",
        "width": 1280,
        "height": 720
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "VOXMORY",
        "description": "Studio de création de chansons personnalisées : Rumba, Afrobeat et poésie sur-mesure pour mariages, anniversaires et hommages.",
        "url": "https://saa-s-voxmory.vercel.app/",
        "image": "https://saa-s-voxmory.vercel.app/og-image.jpg",
        "slogan": "Votre histoire. Votre chanson.",
        "email": "voxmory@gmail.com",
        "telephone": "+243978508099",
        "priceRange": "$20-$1000",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "CD",
          "addressLocality": "Kinshasa"
        },
        "areaServed": {
          "@type": "Country",
          "name": "République Démocratique du Congo"
        },
        "sameAs": ["https://wa.me/243978508099"],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "Chanson Simple",
            "price": "20",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Musique + Vidéo",
            "price": "50",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Premium VIP",
            "price": "100",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Prestation Présentielle",
            "price": "1000",
            "priceCurrency": "USD"
          }
        ]
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VOXMORY" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body class="bg-black text-white antialiased selection:bg-yellow-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
